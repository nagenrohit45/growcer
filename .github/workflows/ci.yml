name: Growcer checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: growcer
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: growcer_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: chmod +x backend/mvnw
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:backend
      - run: npm run test:backend
        env:
          GROWCER_POSTGRES_TEST_URL: postgresql://growcer:test-only-password@localhost:5432/growcer_test
      - run: npm run build:backend
      - run: npm run build
      - run: npm audit --audit-level=high
