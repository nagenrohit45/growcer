spring.application.name=growcer-api
server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}
server.forward-headers-strategy=none
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=10000
spring.jackson.deserialization.fail-on-trailing-tokens=true
server.error.include-message=never
server.error.include-stacktrace=never
growcer.cookie-secure=${COOKIE_SECURE:true}
growcer.public-origin=${PUBLIC_ORIGIN:}
